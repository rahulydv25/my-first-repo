
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WattWise - Energy Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>⚡ WattWise</h1>
        <p>Know your energy. Reduce your waste.</p>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Track Appliance Section -->
        <section>

            <h2>Track Your Appliance</h2>

            <label for="appliance">Appliance Name</label>
            <input
                type="text"
                id="appliance"
                placeholder="Example: Television"
            >

            <label for="power">Power (Watts)</label>
            <input
                type="number"
                id="power"
                placeholder="Example: 100"
            >

            <label for="hours">Hours Used Per Day</label>
            <input
                type="number"
                id="hours"
                placeholder="Example: 5"
            >

            <button onclick="calculateEnergy()">
                Calculate Energy
            </button>

        </section>


        <!-- Result Section -->
        <section>

            <h2>Your Result</h2>

            <p>
                ⚡ Energy Used:
                <strong id="energyResult">0 kWh</strong>
            </p>

            <p>
                💰 Estimated Cost:
                <strong id="costResult">₹0</strong>
            </p>

            <hr>

            <p>
                🌱 Total Energy:
                <strong id="totalEnergyResult">0 kWh</strong>
            </p>

            <p>
                💵 Total Cost:
                <strong id="totalCostResult">₹0</strong>
            </p>
            <p>
    📅 Monthly Energy:
    <strong id="monthlyEnergyResult">0 kWh/month</strong>
</p>

<p>
    💰 Monthly Cost:
    <strong id="monthlyCostResult">₹0/month</strong>
</p>
            <h2>Appliance List</h2>

<div id="applianceList"></div>
<button onclick="clearAllAppliances()">
    Clear All
</button>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
